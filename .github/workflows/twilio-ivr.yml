# Build and publish the Twilio IVR container image.
#
# This workflow holds NO cloud credentials and needs none. It runs the tests,
# builds the image, and publishes it to GHCR — that is all. The server pulls
# the new image on a timer; nothing here pushes into it.
#
# The consequence is that a contributor can ship a change with nothing more
# than push access to this repository: no SSH key, no AWS access, no secrets
# beyond the GITHUB_TOKEN that Actions issues automatically.
#
# The final job then proves the deploy landed by polling the running service
# until it reports the commit that was just built — a stronger signal than
# "the build succeeded".

name: twilio-ivr

on:
  push:
    branches: [main]
    paths:
      - 'twilio-ivr/**'
      - '.github/workflows/twilio-ivr.yml'
  pull_request:
    paths:
      - 'twilio-ivr/**'
      - '.github/workflows/twilio-ivr.yml'
  workflow_dispatch:

# Read-only by default. Only the build job widens this, and only to publish.
permissions:
  contents: read

# Never let two deploys overlap. Deliberately not cancel-in-progress: an
# interrupted image push is worse than a slightly stale queue.
concurrency:
  group: twilio-ivr-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR requires an all-lowercase image path. Both the repository owner and
  # name are already lowercase here; a fork under a mixed-case account would
  # need to lowercase this.
  IMAGE: ghcr.io/${{ github.repository }}/twilio-ivr

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twilio-ivr
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the Dockerfile base image, so the tests run against the
          # same interpreter that will serve calls.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: twilio-ivr/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          # The suite exercises the routes directly, with no Twilio signature
          # to present. Production leaves this at its default of true.
          VALIDATE_TWILIO_SIGNATURE: 'false'
        run: pytest tests/ -q

  build:
    name: build and publish
    needs: test
    # Never publish from a pull request. This repository is public, so anyone
    # can open a PR from a fork; building on PRs is fine, but pushing an image
    # into this namespace from unreviewed code is not.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        # Sliced from GITHUB_SHA rather than `git rev-parse --short`, which can
        # return more than 7 characters when a prefix is ambiguous. The verify
        # job compares against this exact string, so it must be deterministic.
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: twilio-ivr
          push: true
          # The server is a Lightsail nano_3_0, which is x86. Pinned explicitly
          # so a future runner change cannot silently produce an image the box
          # refuses to start with an exec-format error.
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.short_sha }}
          # :latest is what the server pulls. The immutable sha- tag is what
          # makes rollback possible — pin the compose file to a previous one.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx otherwise attaches a provenance attestation, which makes
          # GHCR list phantom "unknown/unknown" architecture entries alongside
          # the real image. Unhelpful for a single-arch image pulled by a plain
          # docker compose.
          provenance: false

  deploy:
    name: deploy
    needs: build
    # Skipped entirely when DEPLOY_HOST is unset, so the workflow still just
    # builds an image for anyone who has no server to push to.
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no, so this is
          # not trusting-on-first-use against a public hostname every run.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # No command is sent: the key's authorized_keys entry carries a
          # forced command, so the server runs its own deploy script and
          # streams the output back here. Anything this client asked for would
          # be discarded, which is the point.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes ubuntu@"$HOST"

      - name: Assert the new commit is actually serving
        env:
          URL: https://${{ vars.DEPLOY_HOST }}/healthz
          WANT: ${{ needs.build.outputs.short_sha }}
        run: |
          # The deploy above already succeeded or failed loudly. This confirms
          # the container that came up is really running the new code, rather
          # than a stale one that restarted cleanly.
          got=""
          for attempt in $(seq 1 12); do
            got="$(curl -fsS --max-time 10 "$URL" | jq -r '.commit // empty' || true)"
            if [ "$got" = "$WANT" ]; then
              echo "Live: serving $got"
              exit 0
            fi
            echo "  attempt $attempt/12: serving=${got:-unreachable}"
            sleep 5
          done
          echo "::error::$URL never reported $WANT (last saw: ${got:-unreachable})"
          exit 1
